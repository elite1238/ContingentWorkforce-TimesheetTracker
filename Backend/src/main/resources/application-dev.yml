spring:
  application:
    name: WF
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workforce_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 86400000

server:
  port: 8080

resend:
  api-key: ${RESEND_API_KEY:re_test_key}
  from: ${RESEND_FROM_EMAIL:vendor@projectbuild.me}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: INFO
    backend.WF: DEBUG
    org.springframework.security: DEBUG

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}
    max-age: 3600
  security:
    rate-limit:
      login:
        requests: 100
        duration-minutes: 1
