spring:
  application:
    name: WF
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workforce_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET:MyVerySecureSecretKeyForJWTTokensLength32CharsMin}
  expiration-ms: 86400000

server:
  port: 8080

resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:vendor@projectbuild.me}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
